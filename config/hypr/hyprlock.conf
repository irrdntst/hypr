# GENERATED from theme/templates/hypr-lock.conf.in by tools/theme.sh.
# Edit the template or theme/palette.env, then re-run it.
#
# hyprlock. https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/
# hyprlang, not Lua — only hyprland.conf moved.
#
# Bound to SUPER+L, and started by hypridle after 10 minutes idle.

$font = JetBrainsMono Nerd Font

general {
    hide_cursor = true
}

# A flat fill rather than a blurred screenshot: no GPU work to unlock, and
# nothing from your screen is left visible while you are away.
background {
    monitor =
    color   = rgba(16181dff)
}

input-field {
    monitor =
    size    = 320, 44

    outline_thickness = 1
    inner_color = rgba(1e2128ff)
    outer_color = rgba(2a2e38ff)
    check_color = rgba(7aa2c7ff)
    fail_color  = rgba(c06a6aff)
    font_color  = rgba(d4d6ddff)

    dots_size    = 0.25
    dots_spacing = 0.3
    rounding     = 0
    fade_on_empty = false

    font_family      = $font
    placeholder_text = password
    fail_text        = $PAMFAIL

    position = 0, -40
    halign   = center
    valign   = center
}

# Clock
label {
    monitor     = 
    text        = $TIME
    color       = rgba(d4d6ddff)
    font_size   = 64
    font_family = $font

    position = 0, 120
    halign   = center
    valign   = center
}

label {
    monitor     = 
    text        = cmd[update:60000] date +"%A, %-d %B"
    color       = rgba(7a8091ff)
    font_size   = 16
    font_family = $font

    position = 0, 60
    halign   = center
    valign   = center
}
