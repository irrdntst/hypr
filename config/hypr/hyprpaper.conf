# hyprpaper. https://wiki.hypr.land/Hypr-Ecosystem/hyprpaper/
# Started from conf/autostart.lua.
#
# Note this file is hyprlang, not Lua — only hyprland.conf moved to Lua.

# Empty monitor = fallback, used for every output that has no rule of its own.
wallpaper {
    monitor  =
    path     = ~/.config/hypr/wallpapers/default.png
    fit_mode = cover
}

# Per-monitor, if you want different images. Names come from `hyprctl monitors`.
# wallpaper {
#     monitor  = DP-1
#     path     = ~/.config/hypr/wallpapers/ultrawide.png
#     fit_mode = cover
# }

# Point path at a directory instead of a file to rotate through it:
# wallpaper {
#     monitor  =
#     path     = ~/.config/hypr/wallpapers
#     fit_mode = cover
#     timeout  = 900
#     order    = random
# }

# The Hyprland splash text over the wallpaper.
splash = false
