# hypridle. https://wiki.hypr.land/Hypr-Ecosystem/hypridle/
# hyprlang, not Lua. Started from conf/autostart.lua.
#
# Timeline while you are away:
#   10 min  lock the screen
#   15 min  turn the display off
#
# No automatic suspend: this is tuned for a desktop. Uncomment the last
# listener if you want the machine to sleep as well.

general {
    # pidof guards against stacking lock screens on top of each other.
    lock_cmd       = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd  = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

listener {
    timeout    = 600
    on-timeout = loginctl lock-session
}

listener {
    timeout    = 900
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume  = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

