[Settings]
# Plain Adwaita plus prefer-dark gives the dark variant with no extra package.
# gnome-themes-extra adds a standalone Adwaita-dark theme; the session script
# switches to it when it is present.
gtk-application-prefer-dark-theme=1
gtk-theme-name=Adwaita
gtk-icon-theme-name=Adwaita
gtk-cursor-theme-name=Adwaita
gtk-cursor-theme-size=24
